{% if is_paginated %}
<nav class="d-flex justify-content-between align-items-center flex-wrap gap-2 p-3 border-top" aria-label="Paginação">
  <small class="text-muted">Página {{ page_obj.number }} de {{ paginator.num_pages }} · {{ paginator.count }} registro(s)</small>
  <ul class="pagination pagination-sm mb-0">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page=1">«</a></li>
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">‹</a></li>
    {% endif %}
    <li class="page-item active"><span class="page-link">{{ page_obj.number }}</span></li>
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">›</a></li>
      <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ paginator.num_pages }}">»</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
