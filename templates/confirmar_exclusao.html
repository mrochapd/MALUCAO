{% extends "base.html" %}
{% block titulo %}Confirmar exclusão{% endblock %}
{% block conteudo %}
<div class="cabecalho"><div><h1>Confirmar exclusão</h1></div></div>
<div class="card border-danger" style="max-width:640px"><div class="card-body">
  <p class="fs-5 mb-2">Deseja realmente excluir <strong>{{ object }}</strong>?</p>
  {% if aviso %}<div class="alert alert-warning small">{{ aviso }}</div>{% endif %}
  <p class="text-muted small">A exclusão ficará registrada no histórico de alterações.</p>
  <form method="post" class="d-flex gap-2">{% csrf_token %}
    <button class="btn btn-danger"><i class="bi bi-trash"></i> Sim, excluir</button>
    <a class="btn btn-outline-secondary" href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancelar</a>
  </form>
</div></div>
{% endblock %}
